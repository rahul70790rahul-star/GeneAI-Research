<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00796B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <polygon points="32,4 59.7,12 59.7,36 32,44 4.3,36 4.3,12" 
           fill="#0A1628" stroke="url(#primaryGradient)" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- DNA Helix -->
  <path d="M 22 16 Q 19 21 22 26 Q 25 31 22 36 Q 19 41 22 46" 
        fill="none" stroke="#1E88E5" stroke-width="2" opacity="0.9"/>
  <path d="M 42 16 Q 45 21 42 26 Q 38 31 42 36 Q 45 41 42 46" 
        fill="none" stroke="#00796B" stroke-width="2" opacity="0.9"/>
  <g stroke="#26A69A" stroke-width="1.5" opacity="0.9">
    <line x1="22" y1="19" x2="42" y2="19"/>
    <line x1="22" y1="24" x2="42" y2="24"/>
    <line x1="22" y1="29" x2="42" y2="29"/>
    <line x1="22" y1="34" x2="42" y2="34"/>
    <line x1="22" y1="39" x2="42" y2="39"/>
  </g>
  
  <!-- Neural Nodes -->
  <circle cx="16" cy="32" r="3.5" fill="url(#primaryGradient)" opacity="0.9"/>
  <circle cx="32" cy="32" r="4.5" fill="url(#primaryGradient)" opacity="1"/>
  <circle cx="48" cy="32" r="3.5" fill="url(#primaryGradient)" opacity="0.9"/>
  <g stroke="url(#primaryGradient)" stroke-width="0.8" opacity="0.4">
    <line x1="19.5" y1="32" x2="27.5" y2="32"/>
    <line x1="36.5" y1="32" x2="44.5" y2="32"/>
  </g>
  
  <text x="32" y="35" text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" font-weight="700" 
        fill="url(#primaryGradient)" 
        filter="url(#glow)">G</text>
</svg>