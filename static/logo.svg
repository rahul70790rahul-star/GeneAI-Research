<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00796B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00796B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26A69A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow circle -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Main hexagon background -->
  <polygon points="100,15 186.6,37.5 186.6,112.5 100,135 13.4,112.5 13.4,37.5" 
           fill="#0A1628" stroke="url(#primaryGradient)" stroke-width="2" filter="url(#subtleGlow)"/>
  
  <!-- DNA Helix -->
  <g filter="url(#glow)">
    <!-- Backbone 1 -->
    <path d="M 70 50 Q 60 65 70 80 Q 80 95 70 110 Q 60 125 70 140" 
          fill="none" stroke="#1E88E5" stroke-width="3" opacity="0.8"/>
    <!-- Backbone 2 -->
    <path d="M 130 50 Q 140 65 130 80 Q 120 95 130 110 Q 140 125 130 140" 
          fill="none" stroke="#00796B" stroke-width="3" opacity="0.8"/>
    <!-- Base pairs -->
    <g stroke="#26A69A" stroke-width="2.5" opacity="0.9">
      <line x1="70" y1="58" x2="130" y2="58"/>
      <line x1="70" y1="73" x2="130" y2="73"/>
      <line x1="70" y1="88" x2="130" y2="88"/>
      <line x1="70" y1="103" x2="130" y2="103"/>
      <line x1="70" y1="118" x2="130" y2="118"/>
    </g>
  </g>
  
  <!-- Neural Network Nodes -->
  <g filter="url(#glow)">
    <!-- Input layer -->
    <circle cx="45" cy="100" r="6" fill="url(#primaryGradient)" opacity="0.9"/>
    <circle cx="45" cy="70" r="5" fill="url(#secondaryGradient)" opacity="0.8"/>
    <circle cx="45" cy="130" r="5" fill="url(#secondaryGradient)" opacity="0.8"/>
    
    <!-- Hidden layer -->
    <circle cx="100" cy="100" r="8" fill="url(#primaryGradient)" opacity="1"/>
    <circle cx="100" cy="60" r="6" fill="url(#secondaryGradient)" opacity="0.8"/>
    <circle cx="100" cy="140" r="6" fill="url(#secondaryGradient)" opacity="0.8"/>
    
    <!-- Output layer -->
    <circle cx="155" cy="100" r="6" fill="url(#primaryGradient)" opacity="0.9"/>
    <circle cx="155" cy="70" r="5" fill="url(#secondaryGradient)" opacity="0.8"/>
    <circle cx="155" cy="130" r="5" fill="url(#secondaryGradient)" opacity="0.8"/>
    
    <!-- Connections -->
    <g stroke="url(#primaryGradient)" stroke-width="1" opacity="0.4">
      <line x1="51" y1="100" x2="92" y2="100"/>
      <line x1="51" y1="70" x2="92" y2="60"/>
      <line x1="51" y1="130" x2="92" y2="140"/>
      <line x1="108" y1="100" x2="149" y2="100"/>
      <line x1="108" y1="60" x2="149" y2="70"/>
      <line x1="108" y1="140" x2="149" y2="130"/>
    </g>
  </g>
  
  <!-- Central "G" letter -->
  <text x="100" y="105" text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="36" font-weight="700" 
        fill="url(#primaryGradient)" 
        filter="url(#glow)">G</text>
  
  <!-- Subtitle indicator -->
  <g transform="translate(100, 155)">
    <rect x="-30" y="0" width="60" height="4" rx="2" fill="url(#primaryGradient)" opacity="0.5"/>
    <rect x="-15" y="6" width="30" height="3" rx="1.5" fill="url(#secondaryGradient)" opacity="0.7"/>
  </g>
</svg>