version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geneai-app-prod
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - GENEAI_DATABASE_PATH=/app/data/geneai_prod.db
      - GENEAI_LOG_LEVEL=WARNING
      - GENEAI_LOG_PATH=/app/logs/geneai_prod.log
      - GENEAI_ENV=production
    volumes:
      - geneai_prod_data:/app/data
      - geneai_prod_logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause

  redis:
    image: redis:7-alpine
    container_name: geneai-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: geneai-postgres-prod
    environment:
      - POSTGRES_DB=geneai_prod
      - POSTGRES_USER=geneai
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  nginx:
    image: nginx:alpine
    container_name: geneai-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  geneai_prod_data:
  geneai_prod_logs:
  redis_prod_data:
  postgres_prod_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password_prod.txt