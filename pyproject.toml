[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneai-research"
version = "5.12.0"
description = "AI-powered biotechnology research platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "GeneAI Research Team", email = "research@geneai.example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.57,<2.0",
    "pandas>=2.0,<4.0",
    "requests>=2.31,<3.0",
    "plotly>=5.18,<8.0",
    "numpy>=1.26,<3.0",
    "biopython>=1.83,<2.0",
    "py3Dmol>=2.0,<3.0",
    "scikit-learn>=1.4,<2.0",
    "networkx>=3.2,<4.0",
    "rdkit>=2023.9,<2027.0",
    "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-mock>=3.12,<4.0",
    "pytest-asyncio>=0.21,<1.0",
    "ruff>=0.1.0,<1.0",
    "mypy>=1.7,<2.0",
    "bandit>=1.7,<2.0",
    "safety>=2.3,<3.0",
    "pre-commit>=3.5,<4.0",
]
docs = [
    "sphinx>=7.2,<8.0",
    "sphinx-rtd-theme>=1.3,<2.0",
    "myst-parser>=2.0,<3.0",
]
cloud = [
    "boto3>=1.34,<2.0",
    "google-cloud-storage>=2.14,<3.0",
    "azure-storage-blob>=12.19,<13.0",
]
all = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-mock>=3.12,<4.0",
    "pytest-asyncio>=0.21,<1.0",
    "ruff>=0.1.0,<1.0",
    "mypy>=1.7,<2.0",
    "bandit>=1.7,<2.0",
    "safety>=2.3,<3.0",
    "pre-commit>=3.5,<4.0",
    "sphinx>=7.2,<8.0",
    "sphinx-rtd-theme>=1.3,<2.0",
    "myst-parser>=2.0,<3.0",
    "boto3>=1.34,<2.0",
    "google-cloud-storage>=2.14,<3.0",
    "azure-storage-blob>=12.19,<13.0",
]

[project.urls]
Homepage = "https://github.com/geneai/geneai-research"
Repository = "https://github.com/geneai/geneai-research"
Issues = "https://github.com/geneai/geneai-research/issues"
Documentation = "https://geneai-research.readthedocs.io"

[project.scripts]
geneai = "app:main"
geneai-test = "run_tests:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geneai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "smoke: Smoke tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "C408",  # Unnecessary list comprehension
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # Allow assert and hardcoded passwords in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "native"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
allow_redefinition = true

[[tool.mypy.overrides]]
module = [
    "geneai.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".git", "__pycache__", "htmlcov"]
skips = ["B101", "B601"]  # Skip assert and shell injection in tests

[tool.coverage.run]
source = ["geneai"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
repo = "local"
hooks = [
    {id = "ruff-check", name = "Ruff Check", entry = "ruff check", language = "system", types = ["python"]},
    {id = "ruff-format", name = "Ruff Format", entry = "ruff format", language = "system", types = ["python"]},
    {id = "mypy", name = "MyPy", entry = "mypy", language = "system", types = ["python"]},
    {id = "pytest", name = "Pytest", entry = "pytest tests/test_smoke.py", language = "system", types = ["python"]},
]